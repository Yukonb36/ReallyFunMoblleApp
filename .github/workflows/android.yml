name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Android project exists
        run: |
          if [ ! -f ./gradlew ] && [ ! -f android/gradlew ]; then
            npx expo prebuild --platform android --non-interactive
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f android/gradlew ]; then
            chmod +x android/gradlew
            cd android
            ./gradlew assembleDebug
          else
            echo "No Gradle wrapper found." >&2
            exit 1
          fi

      - name: Detect APK path
        id: apk
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Could not find debug APK output path." >&2
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Detected APK path: $APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
